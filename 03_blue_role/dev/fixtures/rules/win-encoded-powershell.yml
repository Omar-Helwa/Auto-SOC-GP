title: Encoded PowerShell Command Line
id: win-encoded-powershell
status: test
description: Detects PowerShell started with an encoded command (fixture rule for blue tests).
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
  condition: selection_img and selection_cli
level: medium
tags:
  - attack.execution
  - attack.t1059.001
