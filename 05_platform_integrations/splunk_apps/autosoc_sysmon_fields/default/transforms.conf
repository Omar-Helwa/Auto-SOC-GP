# <EventID>8</EventID>, <Computer>host</Computer>, ... inside <System>
[autosoc_sysmon_system_fields]
REGEX = <(EventID|Version|Level|Task|Opcode|Keywords|EventRecordID|Channel|Computer)>([^<]*)</\1>
FORMAT = $1::$2
MV_ADD = false

# <Security UserID='S-1-5-18'/>
[autosoc_sysmon_security_user]
REGEX = <Security\s+UserID=['"]([^'"]*)['"]
FORMAT = UserID::$1

# <Data Name='TargetImage'>C:\Windows\System32\lsass.exe</Data>
# Values are copied as written in the XML (entities such as &amp; are not decoded).
[autosoc_sysmon_event_data]
REGEX = <Data\s+Name=['"]([A-Za-z][A-Za-z0-9_]*)['"]>([^<]*)</Data>
FORMAT = $1::$2
MV_ADD = false
