# Search-time only. Applies to Sysmon events by source, whatever their
# sourcetype (the prepared datasets use sourcetype XmlWinEventLog).
#
# Remove this app if the official Splunk Add-on for Sysmon is installed:
# both would extract the same fields and produce duplicate values.

[source::XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
KV_MODE = none
REPORT-autosoc_sysmon_system = autosoc_sysmon_system_fields
REPORT-autosoc_sysmon_user = autosoc_sysmon_security_user
REPORT-autosoc_sysmon_data = autosoc_sysmon_event_data

# CIM-style fields used by Splunk Security Content rules
# (for example "stats ... by dest signature_id signature vendor_product").
EVAL-dest = Computer
EVAL-signature_id = EventID
EVAL-vendor_product = if(isnull(EventID), null(), "Microsoft Sysmon")
EVAL-signature = case(isnull(EventID), null(), EventID=="1", "Process Create", EventID=="2", "File creation time changed", EventID=="3", "Network connection detected", EventID=="5", "Process terminated", EventID=="6", "Driver loaded", EventID=="7", "Image loaded", EventID=="8", "CreateRemoteThread detected", EventID=="10", "Process accessed", EventID=="11", "File created", EventID=="12", "Registry object added or deleted", EventID=="13", "Registry value set", EventID=="22", "Dns query", true(), "Sysmon EventID ".EventID)
